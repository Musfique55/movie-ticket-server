name: keepAlive Render
on: 
  workflow_dispatch: 
  schedule:
    - cron: "*/10 * * * *"
jobs:
  ping :
      runs-on: ubuntu-latest
      steps:
        - name: Ping Render Server
          run: curl -s --connect-timeout 30 --max-time 60 --retry 3 --retry-delay 5 https://movie-ticket-server-n9vr.onrender.com/health
